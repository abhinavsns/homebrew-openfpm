name: brew test-bot

# Checks the formulae (style and audit) on every push and pull request. Pull requests also build
# and test the changed formulae as bottles, which the "brew pr-pull" workflow publishes. Pushes
# to other branches than main do the same without publishing, to try changes before opening a
# pull request.
on:
  push:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    name: test-bot (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bottles built on macOS 15 also work on newer versions. Homebrew no longer builds
          # bottles of OpenFPM's dependencies for Intel Macs.
          - name: macOS, Apple Silicon
            os: macos-15
          - name: Linux, x86-64
            os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - name: Linux, ARM64
            os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 360
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Build and test the changed formulae
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            brew test-bot --only-formulae
          else
            # On a push, test-bot compares the pushed commit with itself: name the formulae that
            # differ from main instead
            tap=$(brew --repository "$GITHUB_REPOSITORY")
            git -C "$tap" fetch origin main
            formulae=$(git -C "$tap" diff --name-only origin/main HEAD -- Formula |
                       sed -n 's|^Formula/\(.*\)\.rb$|abhinavsns/openfpm/\1|p')
            if [[ -n "$formulae" ]]; then
              # shellcheck disable=SC2086
              brew test-bot --only-formulae $formulae
            fi
          fi

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
