name: Conda packages

# Builds the conda packages in conda/recipes (OpenFPM and the dependencies conda-forge lacks)
# natively for Linux and macOS whenever they change (on any branch), and publishes them from
# the main branch as a conda channel:
# the packages are added to the conda-channel branch, which GitHub Pages serves at
# https://abhinavsns.github.io/homebrew-openfpm. Packages are only added, never removed, so
# environments locked to them keep working.
on:
  push:
    paths:
      - 'conda/**'
      - '.github/workflows/conda.yml'
  pull_request:
    paths:
      - 'conda/**'
      - '.github/workflows/conda.yml'
  workflow_dispatch:

env:
  RATTLER_BUILD_VERSION: v0.79.0
  PIXI_VERSION: v0.83.0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
            rattler: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            rattler: aarch64-unknown-linux-musl
          - platform: osx-64
            runner: macos-15-intel
            rattler: x86_64-apple-darwin
          - platform: osx-arm64
            runner: macos-15
            rattler: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rattler-build
        run: |
          curl -fsSL -o rattler-build \
            "https://github.com/prefix-dev/rattler-build/releases/download/${RATTLER_BUILD_VERSION}/rattler-build-${{ matrix.rattler }}"
          chmod +x rattler-build

      - name: Build and test the packages
        # bash (unlike the default shell) sets pipefail, so a failed build is not hidden by tee
        shell: bash
        run: ./rattler-build build --recipe-dir conda/recipes -m conda/variants.yaml --output-dir output -c conda-forge 2>&1 | tee build.log

      - name: Check that every package was built
        run: ls output/${{ matrix.platform }}/{openfpm,vcdevel,libhilbert}-*.conda output/noarch/algoim-*.conda

      - name: Show the errors as annotations
        if: failure()
        # The job logs can only be downloaded with admin rights; annotations are public
        run: |
          python3 - <<'EOF'
          import re
          lines = [re.sub(r"\x1b\[[0-9;]*m", "", l) for l in open("build.log", errors="replace").read().splitlines()]
          def annotate(title, chunk):
              message = "\n".join(chunk).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{message}")
          annotate("Error lines of the build log", [l for l in lines if re.search(r"error|fail", l, re.I)][-40:])
          annotate("End of the build log", lines[-60:])
          EOF

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            output/${{ matrix.platform }}/*.conda
            output/noarch/*.conda
          if-no-files-found: error

  publish:
    # Indexes the channel with the new packages on every run; pushes it only from main
    name: Index and publish the channel
    needs: build
    runs-on: ubuntu-24.04
    # One run at a time pushes to the channel branch
    concurrency:
      group: conda-channel-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the channel branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to the channel branch
        run: |
          if git ls-remote --exit-code --heads origin conda-channel > /dev/null; then
            git switch conda-channel
          else
            git switch --orphan conda-channel
          fi

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: /tmp/packages
          pattern: packages-*
          merge-multiple: true

      - name: Add the packages
        run: |
          for subdir in /tmp/packages/*/; do
            name=$(basename "$subdir")
            mkdir -p "$name"
            cp -n "$subdir"*.conda "$name/"
          done
          # A channel needs a noarch subdirectory, and Pages should serve the files as they are
          mkdir -p noarch
          touch .nojekyll

      - name: Index the channel
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          # Index a copy without .git, then bring the repodata files back
          rsync -a --exclude .git ./ /tmp/channel/
          ~/.pixi/bin/pixi exec rattler-index fs /tmp/channel
          rsync -a /tmp/channel/ ./

      - name: Check the channel
        run: |
          python3 - <<'PY'
          import json
          expected = {"noarch": {"algoim"}}
          for subdir in ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]:
              expected[subdir] = {"openfpm", "vcdevel", "libhilbert"}
          for subdir, names in expected.items():
              packages = json.load(open(f"{subdir}/repodata.json"))["packages.conda"]
              found = {p["name"] for p in packages.values()}
              print(subdir, sorted(packages))
              assert names <= found, f"{subdir} lacks {sorted(names - found)}"
          PY

      - name: Push the channel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new packages"
          else
            git commit -m "Add packages built from ${GITHUB_SHA::7}"
            git push origin conda-channel
          fi
